<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Carros</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(135deg,#1c1c1c,#3b0764);
    font-family: Arial, Helvetica, sans-serif;
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:30px 0;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:40px;
    color:#FFD700;
    text-shadow:2px 2px 10px black;
}

.img-destaque{
    width:100%;
    height:420px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid #FFD700;
    box-shadow:0 10px 25px rgba(0,0,0,.5);
    transition:.4s;
}

.img-destaque:hover{
    transform:scale(1.02);
}

.div-images{
    margin-top:30px;
    display:flex;
    gap:20px;
}

.img-pequena{
    width:33.3%;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:.4s;
    cursor:pointer;
}

.img-pequena:hover{
    transform:translateY(-10px) scale(1.05);
    border-color:#FFD700;
    box-shadow:0 15px 30px rgba(255,215,0,.5);
}

</style>

</head>

<body>

<div class="container">

    <h1>🏎️ Galeria de Carros</h1>

    <img class="img-destaque" src="F1.jpg" alt="Carro McLaren">

    <div class="div-images">
        <img class="img-pequena" src="F2.jpg" alt="Ferrari">
        <img class="img-pequena" src="F3.jpg" alt="Fiat Branco">
        <img class="img-pequena" src="F4.jpg" alt="Fiat Cinza">
    </div>

</div>

</body>
</html>
